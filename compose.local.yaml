services:
  nginx:
    ports: !override
      - "127.0.0.1:4300:80"
      - "[::1]:4300:80"
  php:
    environment:
      APP_DEPLOYMENT_ENV: local
      DEFAULT_URI: http://localhost:4300
      METABASE_URL: http://localhost:4301
  postgres:
    ports: !override
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  adminer:
    ports: !override
      - "127.0.0.1:4381:8080"
  metabase:
    ports: !override
      - "127.0.0.1:4301:3000"
    environment:
      MB_SITE_URL: http://localhost:4301
  ollama:
    ports: !override
      - "127.0.0.1:21434:11434"
  qdrant:
    ports: !override
      - "127.0.0.1:16333:6333"
  kestra:
    ports: !override
      - "127.0.0.1:4382:8080"

volumes:
  postgres_data:
    name: united-ati-local-postgres-data
