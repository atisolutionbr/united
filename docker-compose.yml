services:
  nginx:
    image: nginx:1.27-alpine
    container_name: united-nginx
    restart: always
    depends_on:
      php:
        condition: service_started
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      TZ: America/Recife
    volumes:
      - ./apps/core/public:/var/www/html/public:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - united

  php:
    build:
      context: .
      dockerfile: infra/php/Dockerfile
    container_name: united-php
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_DEPLOYMENT_ENV: ${APP_DEPLOYMENT_ENV:-local}
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-change-me-local-secret}
      APP_DEBUG: ${APP_DEBUG:-1}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Recife}
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost:8080}
      DATABASE_URL: ${DATABASE_URL:-postgresql://united:united@postgres:5432/united?serverVersion=16&charset=utf8}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-^https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?$}
      RAW_STORAGE_DIR: ${RAW_STORAGE_DIR:-/var/storage/raw}
      CKAN_RESOURCE_TIMEOUT: ${CKAN_RESOURCE_TIMEOUT:-90}
      METABASE_API_URL: ${METABASE_API_URL:-http://metabase:3000}
      METABASE_URL: ${METABASE_URL:-http://localhost:3001}
      METABASE_SERVICE_EMAIL: ${METABASE_SERVICE_EMAIL:-}
      METABASE_SERVICE_PASSWORD: ${METABASE_SERVICE_PASSWORD:-}
      METABASE_COOKIE_DOMAIN: ${METABASE_COOKIE_DOMAIN:-}
      TZ: America/Recife
    volumes:
      - ./apps/core:/var/www/html
      - ./data:/var/data
      - ./storage:/var/storage
      - ./infra/php/performance.ini:/usr/local/etc/php/conf.d/zz-performance.ini:ro
      - ./infra/php/united-pool.conf:/usr/local/etc/php-fpm.d/zz-united.conf:ro
      - core_vendor:/var/www/html/vendor
      - core_var:/var/www/html/var
      - composer_cache:/tmp/composer-cache
    networks:
      - united

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: united-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-united}
      POSTGRES_USER: ${POSTGRES_USER:-united}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-united}
      TZ: America/Recife
      PGTZ: America/Recife
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - united

  postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: united-postgis-tools
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-united}
      TZ: America/Recife
    command: >
      sh -c "while true; do
      psql -h postgres -U ${POSTGRES_USER:-united} -d ${POSTGRES_DB:-united} -c 'CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS postgis_topology;' >/dev/null;
      sleep 3600;
      done"
    networks:
      - united

  adminer:
    image: adminer:4.8.1
    container_name: united-adminer
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      TZ: America/Recife
    networks:
      - united

  metabase:
    image: metabase/metabase:v0.52.9
    container_name: united-metabase
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${METABASE_PORT:-3000}:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_DB_NAME:-united}
      MB_DB_PORT: 5432
      MB_DB_HOST: postgres
      MB_DB_USER: ${POSTGRES_USER:-united}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-united}
      MB_SITE_URL: ${METABASE_URL:-http://localhost:3001}
      MB_SITE_LOCALE: pt
      JAVA_TIMEZONE: America/Recife
      TZ: America/Recife
    volumes:
      - metabase_data:/metabase-data
    networks:
      - united

  # ─── IA LOCAL — Phase 5 ──────────────────────────────────────────────────────
  # Start with: docker compose --profile ai up -d
  # Install a model: docker compose exec ollama ollama pull llama3
  ollama:
    image: ollama/ollama:latest
    container_name: united-ollama
    restart: unless-stopped
    profiles: ["ai"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      TZ: America/Recife
    networks:
      - united

  # Vector Database — optional, used for RAG/embeddings
  qdrant:
    image: qdrant/qdrant:latest
    container_name: united-qdrant
    restart: unless-stopped
    profiles: ["ai"]
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      TZ: America/Recife
    networks:
      - united

  # ── Fase 6: Orquestração — perfil "ops" ──────────────────────────────────────
  # Para iniciar: docker compose --profile ops up -d

  kestra-postgres:
    image: postgres:16-alpine
    container_name: united-kestra-postgres
    profiles: ["ops"]
    restart: always
    environment:
      POSTGRES_DB: ${KESTRA_POSTGRES_DB:-kestra}
      POSTGRES_USER: ${KESTRA_POSTGRES_USER:-kestra}
      POSTGRES_PASSWORD: ${KESTRA_POSTGRES_PASSWORD:-kestra}
      TZ: America/Recife
      PGTZ: America/Recife
    volumes:
      - kestra_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - united

  kestra:
    image: kestra/kestra:latest-full
    container_name: united-kestra
    profiles: ["ops"]
    restart: always
    user: "root"
    command: server standalone --config /etc/kestra/application.yml
    depends_on:
      kestra-postgres:
        condition: service_healthy
    ports:
      - "${KESTRA_PORT:-8082}:8080"
    environment:
      TZ: America/Recife
    volumes:
      - ./future/kestra/application.yml:/etc/kestra/application.yml:ro
      - ./future/kestra/flows:/app/flows
      - ./future/kestra/examples:/app/examples:ro
      - kestra_storage:/app/storage
      - kestra_tmp:/tmp/kestra-wd
    networks:
      - united
  # ─────────────────────────────────────────────────────────────────────────────

networks:
  united:
    name: united-network
    driver: bridge

volumes:
  postgres_data:
    name: united-postgres-data
  composer_cache:
    name: united-composer-cache
  core_var:
    name: united-core-var
  core_vendor:
    name: united-core-vendor
  metabase_data:
    name: united-metabase-data
  ollama_data:
    name: united-ollama-data
  qdrant_data:
    name: united-qdrant-data
  kestra_postgres_data:
    name: united-kestra-postgres-data
  kestra_storage:
    name: united-kestra-storage
  kestra_tmp:
    name: united-kestra-tmp
