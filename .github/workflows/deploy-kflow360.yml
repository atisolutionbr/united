name: Deploy KFlow360

on:
  push:
    branches: [kflow360]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kflow360-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy no servidor
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Obter código da versão publicada
        uses: actions/checkout@v4

      - name: Enviar pacote para a VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_PORT }}
          source: "."
          target: ${{ vars.DEPLOY_PATH }}
          overwrite: true
          exclude: ".git,.env,apps/core/var,apps/core/vendor,apps/core/node_modules,apps/core/public/assets,storage"

      - name: Atualizar aplicação por SSH
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_PORT }}
          script_stop: true
          script: |
            set -eu
            cd "${{ vars.DEPLOY_PATH }}"
            test -f .env
            test -f apps/core/.env || touch apps/core/.env
            docker compose up -d --build
            docker compose exec -T php php bin/console sass:build
            docker compose exec -T --user root php php bin/console importmap:install --env=prod
            docker compose exec -T --user root php sh -c 'mkdir -p public/assets && chown -R www-data:www-data assets/vendor public/assets'
            docker compose exec -T php php bin/console asset-map:compile --env=prod
            docker compose exec -T php php bin/console cache:clear --env=prod --no-warmup
            docker image prune -f
