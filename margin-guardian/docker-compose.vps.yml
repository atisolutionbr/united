name: takeat-margin-guardian

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - ${ENV_FILE:-.env.production}
  environment:
    DATABASE_URL: postgres://margin_guardian:${POSTGRES_PASSWORD}@postgres:5432/margin_guardian
  networks:
    - backend
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: margin_guardian
      POSTGRES_USER: margin_guardian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U margin_guardian -d margin_guardian"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["node", "dist/src/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    <<: *app
    command: ["node", "dist/src/server.js"]
    ports:
      - "127.0.0.1:18100:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/margin-guardian/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    command: ["node", "dist/src/worker.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
